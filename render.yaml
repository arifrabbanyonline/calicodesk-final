# Render Blueprint — https://render.com/docs/blueprint-spec
# Default app uses SQLite inside the container (fine for single-instance / demos).
# For durable production data, add a Postgres DB and switch Prisma to postgresql
# (see README), then uncomment the DATABASE_URL fromDatabase block below.

services:
  - type: web
    name: calicodesk-shopify
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/app/prisma/dev.sqlite
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SCOPES
        value: read_products
      - key: SHOPIFY_APP_URL
        sync: false
      # Uncomment when using Render Postgres + postgresql provider:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: calicodesk-db
      #     property: connectionString

# databases:
#   - name: calicodesk-db
#     plan: free
#     databaseName: calicodesk
#     user: calicodesk
