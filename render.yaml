# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: calicodesk-shopify
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        value: file:/app/prisma/dev.sqlite
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SCOPES
        value: read_products
      - key: SHOPIFY_APP_URL
        sync: false
